[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aplet"
version = "0.1.0"
description = "Manage app installation across package managers from a YAML inventory."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "octanima-labs" }]
license = "MIT"
dependencies = [
  "2ning==1.0.0",
  "PyYAML>=6.0.3",
  "requests>=2.33.1",
  "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "build>=1.3.0",
  "twine>=6.1.0",
]
docs = [
  "sphinx>=8.0",
  "myst-parser>=4.0",
  "pydata-sphinx-theme>=0.16",
  "sphinx-autodoc-typehints>=3.0",
  "sphinx-copybutton>=0.5",
]

[project.urls]
Repository = "https://github.com/octanima-labs/aplet"
Issues = "https://github.com/octanima-labs/aplet/issues"
Documentation = "https://octanima-labs.github.io/aplet/"

[project.scripts]
aplet = "aplet.cli:main"

[tool.setuptools.packages.find]
include = ["aplet*"]

[tool.setuptools.package-data]
aplet = ["resources/*.conf", "resources/*.yml"]

[tool.pytest.ini_options]
markers = [
  "integration: real package-manager tests that must run inside disposable containers",
]

DEFAULT_INVENTORY_PATH: ~/.local/share/aplet/inventory.yml
DEFAULT_REPO_DIR: ~/Apps/
DEFAULT_PACKAGE_MANAGER: null
PREFERENCE:
- apt
- pacman
- yay
- yum
- dnf
- zypper
- brew
- choco
- scoop
- git
- npm
- pip
- pipx
- flatpak
- snap
- custom_installers


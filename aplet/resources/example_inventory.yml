### APLET INVENTORY ###
apps:
  git:
    category: [development, version-control]
    tags: [essential, cli]
    managers:
      apt:
      pacman:
      dnf:
      zypper:
      brew:
      choco:
  pyenv:
    candidate: pyenv
    category: [development, python, runtimes]
    tags: [python, cli]
    managers:
    installers: 
      arch:
        # List of actions
        - cmd:
          - "curl -fsSL https://pyenv.run | bash"
        - patch_file:
          - '~/.bashrc'
          - 'pyenv-init'
          - 'export PYENV_ROOT="$HOME/.pyenv"'
          - '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
          - 'eval "$(pyenv init - bash)"'
        - pacman:
          - base-devel
          - openssl
          - zlib
          - xz
          - tk
          - zstd
        - cmd:
          - pyenv update
          - pyenv install 3.11 3.14
          - python global 3.14
      ubuntu_debian:
        # List of actions
        - cmd:
          - "curl -fsSL https://pyenv.run | bash"
        - patch_file:
          - '~/.bashrc'
          - 'pyenv-init'
          - 'export PYENV_ROOT="$HOME/.pyenv"'
          - '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
          - 'eval "$(pyenv init - bash)"'
        - apt:
          - make
          - build-essential
          - libssl-dev
          - zlib1g-dev
          - libbz2-dev
          - libreadline-dev
          - libsqlite3-dev
          - curl
          - git
          - libncursesw5-dev
          - xz-utils
          - tk-dev
          - libxml2-dev
          - libxmlsec1-dev
          - libffi-dev
          - liblzma-dev
        - cmd:
          - pyenv update
          - pyenv install 3.11 3.14
          - python global 3.14
      centos: 
        # List of actions
        - cmd:
          - "curl -fsSL https://pyenv.run | bash"
        - patch_file:
          - '~/.bashrc'
          - 'pyenv-init'
          - 'export PYENV_ROOT="$HOME/.pyenv"'
          - '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
          - 'eval "$(pyenv init - bash)"'
        - yum: gcc make patch zlib-devel bzip2 bzip2-devel readline-devel sqlite sqlite-devel openssl-devel tk-devel libffi-devel xz-devel
        - cmd:
          - pyenv update
          - pyenv install 3.11 3.14
          - python global 3.14
      opensuse: 
        # List of actions
        - cmd:
          - "curl -fsSL https://pyenv.run | bash"
        - patch_file:
          - '~/.bashrc'
          - 'pyenv-init'
          - 'export PYENV_ROOT="$HOME/.pyenv"'
          - '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
          - 'eval "$(pyenv init - bash)"'
        - zypper: 
          - gcc
          - automake
          - bzip2
          - libbz2-devel
          - xz
          - xz-devel
          - openssl-devel
          - ncurses-devel 
          - readline-devel
          - zlib-devel
          - tk-devel
          - libffi-devel
          - sqlite3-devel
          - gdbm-devel
          - make
          - findutils
          - patch
          - libzstd-devel
        - cmd:
          - pyenv update
          - pyenv install 3.11 3.14
          - python global 3.14
      macos:
        # List of actions
        - cmd:
          - "curl -fsSL https://pyenv.run | bash"
        - patch_file:
          - '~/.bashrc'
          - 'pyenv-init'
          - 'export PYENV_ROOT="$HOME/.pyenv"'
          - '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
          - 'eval "$(pyenv init - bash)"'
        - cmd:
          - 'xcode-select --install'
        - brew: openssl readline sqlite3 xz tcl-tk@8 libb2 zstd zlib pkgconfig
        - cmd:
          - pyenv update
          - pyenv install 3.11 3.14
          - python global 3.14
      win:
        - cmd:
          - 'Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/pyenv-win/pyenv-win/master/pyenv-win/install-pyenv-win.ps1" -OutFile "./install-pyenv-win.ps1"; &"./install-pyenv-win.ps1"'
          - pyenv update
          - pyenv install 3.11 3.14
          - python global 3.14

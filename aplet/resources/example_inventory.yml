  sublime-text:
    # wiki: https://www.sublimetext.com/docs/linux_repositories.html
    candidate: sublime-text
    category: [development, editors]
    tags: [gui, recommended]
    managers:
      apt:
        # candidate: 'sublime-text' # Override root candidate
        repo: "Types: deb\nURIs: https://download.sublimetext.com/\nSuites: apt/stable/\nSigned-By: /etc/apt/keyrings/sublimehq-pub.asc"
        gpg: https://download.sublimetext.com/sublimehq-pub.gpg
      pacman: 
        repo: "\n[sublime-text]\nServer = https://download.sublimetext.com/arch/stable/x86_64"
        gpg: https://download.sublimetext.com/sublimehq-pub.gpg
      yum:
        # yum, dnf, zypper use rpm channel and gpg
        repo: "https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo"
        gpg: "https://download.sublimetext.com/sublimehq-rpm-pub.gpg"
      dnf:
        repo: "https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo"
        gpg: "https://download.sublimetext.com/sublimehq-rpm-pub.gpg"
      zypper:
        repo: "https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo"
        gpg: "https://download.sublimetext.com/sublimehq-rpm-pub.gpg"
      brew:
        candidate: "--cask sublime-text"
      choco:
        candidate: "sublimetext4"
      scoop:
        bucket_name: "extras"
        candidate: "extras/sublime-text"
    installers:
  docker:
    candidate: docker
    category: [development, containers]
    tags: [container, cli, devops]
    managers:
    installers:
      arch:
        - pacman: docker docker-compose
        - cmd:
          - sudo systemctl enable docker.socket
          - sudo systemctl start docker.socket
          - sudo docker info
          - sudo usermod -aG docker $(whoami)
      ubuntu:
        - cmd:
          - sudo apt remove $(dpkg --get-selections docker.io docker-compose docker-compose-v2 docker-doc podman-docker containerd runc | cut -f1)
        - apt: ca-certificates curl
        - cmd:
          - sudo install -m 0755 -d /etc/apt/keyrings
          - sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          - sudo chmod a+r /etc/apt/keyrings/docker.asc
        - patch_file:
          - /etc/apt/sources.list.d/docker.sources 
          - docker
          - 'Types: deb'
          - 'URIs: https://download.docker.com/linux/ubuntu\nSuites: {{cmd:. /etc/os-release && printf %s "${UBUNTU_CODENAME:-$VERSION_CODENAME}"}}'
          - 'Components: stable\nArchitectures: {{cmd:dpkg --print-architecture}}'
          - 'Signed-By: /etc/apt/keyrings/docker.asc'
        - apt:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        - cmd:
          - sudo systemctl enable docker.socket
          - sudo usermod -aG docker $(whoami)
      debian:
        - cmd:
          - sudo apt remove $(dpkg --get-selections docker.io docker-compose docker-doc podman-docker containerd runc | cut -f1)
        - apt: ca-certificates curl
        - cmd:
          - sudo install -m 0755 -d /etc/apt/keyrings
          - sudo curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          - sudo chmod a+r /etc/apt/keyrings/docker.asc
        - patch_file:
          - /etc/apt/sources.list.d/docker.sources
          - docker
          - 'Types: deb'
          - 'URIs: https://download.docker.com/linux/debian'
          - 'Suites: {{cmd:. /etc/os-release && echo "$VERSION_CODENAME"}}'
          - 'Components: stable'
          - 'Architectures: {{cmd:dpkg --print-architecture}}'
          - 'Signed-By: /etc/apt/keyrings/docker.asc'
        - apt: docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        - cmd:
          - sudo systemctl enable docker.socket
          - sudo usermod -aG docker $(whoami)
